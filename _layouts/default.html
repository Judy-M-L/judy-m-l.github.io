<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="alternate" type="application/rss+xml" href="{{ '/feed.xml' | relative_url }}">
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #6b6b6b; --faint: #9a9a9a; --line: #ececec;
    --pill: #ffffff; --pill-line: #e6e6e6; --hover: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e; --fg: #f2f2f2; --muted: #a3a3a3; --faint: #6e6e6e; --line: #232323;
      --pill: #161616; --pill-line: #2a2a2a; --hover: #1c1c1c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 20px; }

  nav { position: sticky; top: 12px; z-index: 10; padding: 0 12px; }
  nav .pill { max-width: 700px; margin: 0 auto; height: 48px; border: 1px solid var(--pill-line); border-radius: 999px;
    background: color-mix(in srgb, var(--pill) 85%, transparent); backdrop-filter: blur(10px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 18px; }
  nav .mark { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  nav ul { display: flex; gap: 22px; list-style: none; margin: 0; padding: 0; font-size: 14px; }
  nav ul a { color: var(--muted); padding: 4px 0; }
  nav ul a:hover { color: var(--fg); text-decoration: none; }
  nav ul a.on { color: var(--fg); border-bottom: 1.5px solid var(--fg); }
  nav .right { text-align: right; font-size: 13px; color: var(--faint); }

  main { padding: 72px 0 80px; }
  h1 { font-size: 36px; line-height: 1.1; letter-spacing: -0.025em; margin: 0 0 4px; font-weight: 700; }
  .alt { font-size: 18px; color: var(--muted); margin: 0 0 28px; }
  h2 { font-size: 20px; margin: 44px 0 10px; letter-spacing: -0.015em; }
  h3 { font-size: 16px; margin: 24px 0 6px; }
  p, li { max-width: 62ch; }
  .lede { font-size: 17px; color: var(--muted); }
  .label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin: 56px 0 14px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  blockquote { margin: 20px 0; padding: 2px 16px; border-left: 2px solid var(--line); color: var(--muted); }
  code { background: var(--hover); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  pre { background: var(--hover); border-radius: 8px; padding: 14px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 16px 0; }
  th, td { text-align: left; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
  img { max-width: 100%; border-radius: 8px; }

  .icons { display: flex; gap: 22px; align-items: center; }
  .icons a { color: var(--fg); display: inline-flex; }
  .icons svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .list { list-style: none; padding: 0; margin: 0; }
  .list li { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .list a.t { font-weight: 600; display: block; }
  .list .d { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .more { display: inline-block; margin-top: 14px; font-size: 14px; color: var(--muted); }

  .btn { display: inline-block; padding: 8px 14px; border-radius: 999px; font-size: 14px; border: 1px solid var(--pill-line); }
  .btn:hover { background: var(--hover); text-decoration: none; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }

  footer { padding: 24px 0 56px; color: var(--muted); font-size: 14px; }
  footer .links { display: flex; gap: 18px; flex-wrap: wrap; }

  @media (max-width: 600px) {
    nav .pill { grid-template-columns: auto 1fr; padding: 0 14px; }
    nav .right { display: none; }
    nav ul { justify-content: flex-end; gap: 16px; }
    main { padding-top: 56px; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<nav><div class="pill">
  <a class="mark" href="{{ '/' | relative_url }}">JM</a>
  <ul>
    <li><a href="{{ '/' | relative_url }}" {% if page.url == "/" %}class="on"{% endif %}>Home</a></li>
    <li><a href="{{ '/writing/' | relative_url }}" {% if page.url == "/writing/" or page.layout == "post" %}class="on"{% endif %}>Writing</a></li>
    <li><a href="{{ '/work/' | relative_url }}" {% if page.url == "/work/" %}class="on"{% endif %}>Work</a></li>
    <li><a href="{{ '/about/' | relative_url }}" {% if page.url == "/about/" %}class="on"{% endif %}>About</a></li>
  </ul>
  <div class="right">Toronto</div>
</div></nav>
<main><div class="wrap">
{{ content }}
</div></main>
<footer><div class="wrap">
  <div class="links">
    <a href="mailto:judy383m@gmail.com">Contact</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </div>
</div></footer>
</body>
</html>
