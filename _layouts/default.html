<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="alternate" type="application/rss+xml" href="{{ '/feed.xml' | relative_url }}">
<style>
  :root {
    --bg: #fafaf8; --fg: #1a1f2e; --muted: #5b6275; --line: #e3e4e8;
    --accent: #1f2a5c; --accent-soft: #e8ebf6; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1320; --fg: #e9eaf0; --muted: #9ba1b5; --line: #262b3d;
      --accent: #9fb0ff; --accent-soft: #1b2140; --card: #161b2c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.65 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  nav { border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 60px; }
  nav .name { font-weight: 700; white-space: nowrap; color: var(--fg); }
  nav ul { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; font-size: 15px; }
  nav ul a { color: var(--muted); }
  nav ul a:hover, nav ul a.on { color: var(--fg); text-decoration: none; }

  main { padding: 48px 0 64px; }
  h1 { font-size: clamp(30px, 5vw, 40px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 8px; }
  h2 { font-size: 22px; margin: 40px 0 12px; letter-spacing: -0.01em; }
  h3 { font-size: 18px; margin: 28px 0 8px; }
  p, li { max-width: 68ch; }
  .meta { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
  .lede { font-size: 19px; color: var(--muted); }
  blockquote { margin: 20px 0; padding: 4px 18px; border-left: 3px solid var(--accent); color: var(--muted); }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 16px 0; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
  img { max-width: 100%; border-radius: 8px; }

  .posts { list-style: none; padding: 0; margin: 0; }
  .posts li { display: grid; grid-template-columns: 110px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  .posts li:first-child { border-top: 0; }
  .posts time { color: var(--muted); font-size: 14px; padding-top: 3px; }
  .posts a { font-weight: 600; color: var(--fg); }
  .posts .sum { color: var(--muted); font-size: 15px; margin-top: 2px; }

  .btn { display: inline-block; padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 15px; border: 1px solid var(--accent); color: var(--accent); }
  .btn:hover { text-decoration: none; opacity: .85; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .tag { font-size: 12.5px; background: var(--accent-soft); color: var(--accent); padding: 3px 9px; border-radius: 999px; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 48px; color: var(--muted); font-size: 14px; }
  footer .links { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 6px; }

  @media (max-width: 600px) {
    .posts li { grid-template-columns: 1fr; gap: 2px; }
    nav ul { gap: 14px; font-size: 14px; }
  }
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="name" href="{{ '/' | relative_url }}">Jiyoung Min</a>
  <ul>
    <li><a href="{{ '/' | relative_url }}" {% if page.url == "/" %}class="on"{% endif %}>Writing</a></li>
    <li><a href="{{ '/work/' | relative_url }}" {% if page.url == "/work/" %}class="on"{% endif %}>Work</a></li>
    <li><a href="{{ '/about/' | relative_url }}" {% if page.url == "/about/" %}class="on"{% endif %}>About</a></li>
  </ul>
</div></nav>
<main><div class="wrap">
{{ content }}
</div></main>
<footer><div class="wrap">
  <div class="links">
    <a href="mailto:judy383m@gmail.com">Email</a>
    <a href="https://www.linkedin.com/in/jiyougmin/">LinkedIn</a>
    <a href="https://github.com/Judy-M-L">GitHub</a>
    <a href="https://seedtoronto.org">SEED Toronto</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </div>
  <div>Toronto, ON · © {{ site.time | date: "%Y" }} Jiyoung Min</div>
</div></footer>
</body>
</html>
