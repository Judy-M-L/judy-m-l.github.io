---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <div class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</div>
  {{ content }}
</article>
<hr>
<p class="meta"><a href="{{ '/' | relative_url }}">← All writing</a></p>
